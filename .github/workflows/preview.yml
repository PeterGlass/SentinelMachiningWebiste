name: PR Preview

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  preview-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment preview links
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            
            const previewUrl = `https://htmlpreview.github.io/?https://github.com/${owner}/${repo}/blob/${branch}/index.html`;
            
            const body = `## 🔍 Preview This PR

            **Option 1 — Online Preview:**
            [View on HTMLPreview](${previewUrl})
            _(Note: Some images/styles may not load perfectly in HTMLPreview)_

            **Option 2 — Local Preview (recommended):**
            \`\`\`bash
            git fetch origin ${branch}
            git checkout ${branch}
            # Open index.html in your browser, or:
            python3 -m http.server 8000
            # Then visit http://localhost:8000
            \`\`\`

            **Option 3 — Quick look:**
            Browse the files directly on GitHub in this PR's "Files changed" tab.

            ---
            _Preview generated for commit \`${sha}\`_`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('Preview This PR')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }
